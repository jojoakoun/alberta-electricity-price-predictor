project:
  name: "Alberta Electricity Price Predictor"
  environment: "development"

paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  model_dir: "models"
  log_dir: "logs"

data:
  historical_csv_name: "Hourly_Metered_Volumes_and_Pool_Price_and_AIL_2020-Jul2025.csv"
  datetime_utc_column: "datetime_universal_time"
  datetime_local_column: "datetime_local_time"
  actual_price_column: "actual_price"
  forecast_price_column: "forecast_price"

api:
  host: "127.0.0.1"
  port: 8000
  aeso_base_url: "https://apimgw.aeso.ca/public/poolprice-api/v1.1"
  aeso_pool_price_endpoint: "/price/poolPrice"

modeling:
  horizons_hours: [1, 3, 6, 12, 24]
  spike_method: "iqr"
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15