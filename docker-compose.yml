services:
  postgres:
    image: postgres:16
    container_name: wattwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wattwise
      POSTGRES_USER: wattwise
      POSTGRES_PASSWORD: wattwise_dev
    ports:
      - "5433:5432"
    volumes:
      - wattwise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattwise -d wattwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wattwise_postgres_data:
